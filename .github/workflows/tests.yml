name: tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Run test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Run test
        run: |
          mvn -B "-Dstyle.color=always" clean install archetype:integration-test "-Dgpg.skip"
